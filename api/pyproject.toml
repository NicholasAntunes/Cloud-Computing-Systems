[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudfiles-api"
version = "0.1.0"
description = "REST API of the Cloud File Exchange System"
requires-python = ">=3.12"
dependencies = [
    # Blob Storage (app/storage). aiohttp is the HTTP transport of the async SDK.
    "azure-storage-blob>=12.31,<13",
    "azure-identity>=1.27,<2",
    "aiohttp>=3.14,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
