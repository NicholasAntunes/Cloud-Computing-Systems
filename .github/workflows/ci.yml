name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
        env:
          AZURITE_SKIP_API_VERSION_CHECK: "true"

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloudfiles
          POSTGRES_USER: cloudfiles
          POSTGRES_PASSWORD: cloudfiles_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio

      - name: Lint with Ruff
        if: hashFiles('api/**') != ''
        run: |
          ruff check api/

      - name: Install API package
        if: hashFiles('api/pyproject.toml') != ''
        run: |
          cd api && pip install -e ".[dev]"

      - name: Run Backend Tests
        if: hashFiles('api/tests/**') != ''
        env:
          STORAGE_AUTH: connection_string
          BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
          BLOB_CONTAINER: files
          DATABASE_URL: "postgresql+psycopg://cloudfiles:cloudfiles_dev_password@127.0.0.1:5432/cloudfiles"
        run: |
          cd api && python -m pytest -v

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        if: hashFiles('web/package.json') != ''
        run: |
          cd web && npm ci

      - name: Lint and build frontend
        if: hashFiles('web/package.json') != ''
        run: |
          cd web && npm run lint --if-present && npm run build --if-present
